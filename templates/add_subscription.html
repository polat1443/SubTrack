<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yeni Abonelik Ekle - SubTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🚀 SubTrack</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Yeni Abonelik Ekle</h4>
                    </div>
                    <div class="card-body">
                        <form action="/add" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Abonelik Adı (Örn: Netflix)</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Plan Tipi</label>
                                <select class="form-select" name="plan_type">
                                    <option value="Aylık">Aylık</option>
                                    <option value="Yıllık">Yıllık</option>
                                    <option value="Haftalık">Haftalık</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fiyat (₺)</label>
                                <input type="number" step="0.01" class="form-control" name="price" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Başlangıç Tarihi</label>
                                <input type="date" class="form-control" name="start_date" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Kaydet</button>
                            <a href="/" class="btn btn-secondary w-100 mt-2">İptal</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
